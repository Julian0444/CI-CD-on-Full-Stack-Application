name: Full CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/tp8-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/tp8-frontend

jobs:
  # ────────────────────────── Backend tests ──────────────────────────
  backend-tests:
    name: Backend Tests (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --noinput
        env:
          DJANGO_SETTINGS_MODULE: config.settings.ci

      - name: Run tests with coverage
        run: |
          python -m pytest \
            --cov \
            --cov-report=xml \
            --cov-report=term-missing \
            -v
        env:
          DJANGO_SETTINGS_MODULE: config.settings.ci

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ────────────────────────── Frontend tests ─────────────────────────
  frontend-tests:
    name: Frontend Tests (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npx jest --coverage --watchAll=false --ci
        env:
          CI: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/

  # ────────────────────────── SonarCloud ─────────────────────────────
  sonarcloud-analysis:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: .
          args: >
            -Dsonar.branch.name=${{ github.ref_name }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ────────────────────────── Build images ───────────────────────────
  build_images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build & push backend
        run: |
          docker build -t $BACKEND_IMAGE:qa-latest -t $BACKEND_IMAGE:${{ github.sha }} backend/
          docker push $BACKEND_IMAGE:qa-latest
          docker push $BACKEND_IMAGE:${{ github.sha }}

      - name: Build & push frontend
        run: |
          docker build -t $FRONTEND_IMAGE:qa-latest -t $FRONTEND_IMAGE:${{ github.sha }} frontend/
          docker push $FRONTEND_IMAGE:qa-latest
          docker push $FRONTEND_IMAGE:${{ github.sha }}

  # ────────────────────────── Deploy QA ──────────────────────────────
  deploy_qa:
    name: Deploy to QA
    runs-on: ubuntu-latest
    needs: [build_images]
    environment: qa
    steps:
      - name: Trigger Render deploy (backend)
        run: curl -sS -X POST "${{ secrets.RENDER_BACKEND_QA_HOOK }}"

      - name: Trigger Render deploy (frontend)
        run: curl -sS -X POST "${{ secrets.RENDER_FRONTEND_QA_HOOK }}"

      - name: Wait for deploy
        run: sleep 60

      - name: Print QA URLs
        run: |
          echo "=============================="
          echo "  QA deployment triggered"
          echo "  Frontend: ${{ vars.FRONTEND_QA_URL }}"
          echo "=============================="

  # ────────────────────────── E2E Tests ──────────────────────────────
  e2e-tests:
    name: E2E Tests (Cypress)
    runs-on: ubuntu-latest
    needs: [deploy_qa]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress
        run: npx cypress run --browser chrome
        env:
          CYPRESS_BASE_URL: ${{ vars.FRONTEND_QA_URL }}

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            frontend/cypress/videos/
            frontend/cypress/screenshots/

  # ────────────────────────── Deploy PROD ────────────────────────────
  deploy_prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [e2e-tests, sonarcloud-analysis]
    environment: prod
    steps:
      - name: Tag images as prod
        run: |
          echo "Promoting QA images to PROD..."

      - name: Trigger Render deploy (backend)
        run: curl -sS -X POST "${{ secrets.RENDER_BACKEND_PROD_HOOK }}"

      - name: Trigger Render deploy (frontend)
        run: curl -sS -X POST "${{ secrets.RENDER_FRONTEND_PROD_HOOK }}"

      - name: Print PROD URLs
        run: |
          echo "=============================="
          echo "  PROD deployment triggered"
          echo "  Frontend: ${{ vars.FRONTEND_PROD_URL }}"
          echo "=============================="

  # ────────────────────────── Summary ────────────────────────────────
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, sonarcloud-analysis, e2e-tests]
    if: always()
    steps:
      - name: Report
        run: |
          echo "========================================="
          echo "  CI/CD Pipeline Summary"
          echo "========================================="
          echo "  Backend Tests:  ${{ needs.backend-tests.result }}"
          echo "  Frontend Tests: ${{ needs.frontend-tests.result }}"
          echo "  SonarCloud:     ${{ needs.sonarcloud-analysis.result }}"
          echo "  E2E Tests:      ${{ needs.e2e-tests.result }}"
          echo "========================================="
