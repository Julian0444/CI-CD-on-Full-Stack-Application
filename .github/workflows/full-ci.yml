name: Full CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────── Detectar qué integraciones externas están configuradas ────────────
  # Permite que el pipeline quede VERDE aunque todavía no hayas conectado
  # SonarCloud o Render: los jobs que dependen de esos secrets se saltan.
  check-secrets:
    name: Check configured integrations
    runs-on: ubuntu-latest
    outputs:
      has_sonar: ${{ steps.detect.outputs.has_sonar }}
      has_render: ${{ steps.detect.outputs.has_render }}
    steps:
      - id: detect
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          RENDER_HOOK: ${{ secrets.RENDER_BACKEND_QA_HOOK }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then echo "has_sonar=true" >> "$GITHUB_OUTPUT"; else echo "has_sonar=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$RENDER_HOOK" ]; then echo "has_render=true" >> "$GITHUB_OUTPUT"; else echo "has_render=false" >> "$GITHUB_OUTPUT"; fi

  # ────────────────────────── Backend tests ──────────────────────────
  backend-tests:
    name: Backend Tests (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --noinput
        env:
          DJANGO_SETTINGS_MODULE: config.settings.ci

      - name: Run tests with coverage
        run: |
          python -m pytest \
            --cov \
            --cov-report=xml \
            --cov-report=term-missing \
            -v
        env:
          DJANGO_SETTINGS_MODULE: config.settings.ci

      # coverage.py escribe las fuentes como "apps"/"config"; SonarCloud
      # analiza desde la raíz del repo, así que les anteponemos "backend/"
      # para que resuelva backend/apps/... y backend/config/...
      - name: Fix coverage source paths for SonarCloud
        run: |
          sed -i 's#<source>apps</source>#<source>backend/apps</source>#; s#<source>config</source>#<source>backend/config</source>#' coverage.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ────────────────────────── Frontend tests ─────────────────────────
  frontend-tests:
    name: Frontend Tests (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0 # este job solo corre Jest, no Cypress

      - name: Run tests with coverage
        run: npx jest --coverage --watchAll=false --ci
        env:
          CI: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/

  # ────────────────────────── E2E Tests (Cypress) ─────────────────────
  # Corre dentro del CI contra el frontend servido localmente (npm start).
  # El spec mockea el backend con cy.intercept, así que NO necesita un
  # entorno desplegado: es confiable y no depende de Render.
  e2e-tests:
    name: E2E Tests (Cypress)
    runs-on: ubuntu-latest
    needs: [frontend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cypress run (servidor local)
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          start: npm start
          wait-on: http://localhost:3000
          wait-on-timeout: 180
          browser: chrome
        env:
          BROWSER: none

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            frontend/cypress/videos/
            frontend/cypress/screenshots/

  # ────────────────────────── SonarCloud ─────────────────────────────
  sonarcloud-analysis:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, check-secrets]
    if: needs.check-secrets.outputs.has_sonar == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: .
          args: >
            -Dsonar.branch.name=${{ github.ref_name }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ────────────────────────── Build images ───────────────────────────
  build_images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image names
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE=ghcr.io/${OWNER}/tp8-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${OWNER}/tp8-frontend" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        run: |
          docker build -t $BACKEND_IMAGE:qa-latest -t $BACKEND_IMAGE:${{ github.sha }} backend/
          docker push $BACKEND_IMAGE:qa-latest
          docker push $BACKEND_IMAGE:${{ github.sha }}

      - name: Build & push frontend
        run: |
          docker build -t $FRONTEND_IMAGE:qa-latest -t $FRONTEND_IMAGE:${{ github.sha }} frontend/
          docker push $FRONTEND_IMAGE:qa-latest
          docker push $FRONTEND_IMAGE:${{ github.sha }}

  # ────────────────────────── Deploy QA ──────────────────────────────
  # Dispara los deploy hooks de Render. El del backend es requerido
  # (gate has_render); el del frontend es opcional (se saltea si no está).
  deploy_qa:
    name: Deploy to QA
    runs-on: ubuntu-latest
    needs: [build_images, e2e-tests, check-secrets]
    if: github.ref == 'refs/heads/main' && needs.check-secrets.outputs.has_render == 'true'
    environment: qa
    steps:
      - name: Trigger Render deploys (QA)
        env:
          BACKEND_HOOK: ${{ secrets.RENDER_BACKEND_QA_HOOK }}
          FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_QA_HOOK }}
        run: |
          if [ -n "$BACKEND_HOOK" ]; then
            echo "→ Deploy backend QA"; curl -fsS -X POST "$BACKEND_HOOK" && echo " OK"
          else
            echo "Sin RENDER_BACKEND_QA_HOOK; salteo backend"
          fi
          if [ -n "$FRONTEND_HOOK" ]; then
            echo "→ Deploy frontend QA"; curl -fsS -X POST "$FRONTEND_HOOK" && echo " OK"
          else
            echo "Sin RENDER_FRONTEND_QA_HOOK; salteo frontend (opcional)"
          fi

  # ────────────────────────── Deploy PROD ────────────────────────────
  deploy_prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy_qa, sonarcloud-analysis]
    # Promociona a prod sólo si QA deployó OK. Si SonarCloud no está
    # configurado (skipped) igual se permite; si está y falló, no.
    if: >
      always() &&
      needs.deploy_qa.result == 'success' &&
      (needs.sonarcloud-analysis.result == 'success' || needs.sonarcloud-analysis.result == 'skipped')
    environment: prod
    steps:
      - name: Trigger Render deploys (PROD)
        env:
          BACKEND_HOOK: ${{ secrets.RENDER_BACKEND_PROD_HOOK }}
          FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_PROD_HOOK }}
        run: |
          if [ -n "$BACKEND_HOOK" ]; then
            echo "→ Deploy backend PROD"; curl -fsS -X POST "$BACKEND_HOOK" && echo " OK"
          else
            echo "Sin RENDER_BACKEND_PROD_HOOK; salteo backend"
          fi
          if [ -n "$FRONTEND_HOOK" ]; then
            echo "→ Deploy frontend PROD"; curl -fsS -X POST "$FRONTEND_HOOK" && echo " OK"
          else
            echo "Sin RENDER_FRONTEND_PROD_HOOK; salteo frontend (opcional)"
          fi

  # ────────────────────────── Summary ────────────────────────────────
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, e2e-tests, sonarcloud-analysis]
    if: always()
    steps:
      - name: Report
        run: |
          echo "========================================="
          echo "  CI/CD Pipeline Summary"
          echo "========================================="
          echo "  Backend Tests:  ${{ needs.backend-tests.result }}"
          echo "  Frontend Tests: ${{ needs.frontend-tests.result }}"
          echo "  E2E Tests:      ${{ needs.e2e-tests.result }}"
          echo "  SonarCloud:     ${{ needs.sonarcloud-analysis.result }}"
          echo "========================================="
