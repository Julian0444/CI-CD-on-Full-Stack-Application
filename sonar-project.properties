# --- Project metadata ---
sonar.projectKey=ignaciomagoia_tp8ingsoft3
sonar.organization=ignaciomagoia
sonar.host.url=https://sonarcloud.io
sonar.projectName=tp8ingsoft3
sonar.sourceEncoding=UTF-8

# --- Sources (Django backend + React frontend) ---
sonar.sources=backend,frontend/src
sonar.exclusions=**/node_modules/**,**/coverage/**,**/*_test.py,**/tests/**,**/migrations/**,backend/.venv/**,backend_legacy_go/**

# --- Tests ---
sonar.tests=backend,frontend/src
sonar.test.inclusions=backend/**/tests/**/*.py,frontend/src/**/?(*.)test.*,frontend/src/**/__tests__/**
sonar.test.exclusions=**/node_modules/**,**/coverage/**

# --- Coverage reports ---
# Python coverage (Django)
sonar.python.coverage.reportPaths=backend/coverage.xml

# Jest coverage
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov-report/lcov.info

# --- Coverage exclusions ---
sonar.coverage.exclusions=**/node_modules/**,**/coverage/**,backend/**/tests/**,frontend/src/**/?(*.)test.*,frontend/src/**/__tests__/**,**/migrations/**,backend/.venv/**,backend_legacy_go/**
